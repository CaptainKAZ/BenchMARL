
name: gru

hidden_size: 256
n_layers: 1
bias: True
dropout: 0
compile: False   # 实测 torch.compile(mode="reduce-overhead") 反而更慢（actor fwd+bwd 186.5ms → 104.7ms，见 /tmp/opencode/bench3_opt.py）
use_input_passthrough: True
mlp_num_cells: [256,256]
mlp_layer_class: torch.nn.Linear
mlp_activation_class: torch.nn.GELU
mlp_activation_kwargs: null
mlp_norm_class: torch.nn.LayerNorm
mlp_norm_kwargs:
  normalized_shape: 256

# [P0-C] 角色条件化动作头：GRU 之后按角色分叉的 loc/scale 输出头
role_ids: [0, 1, 2, 2]      # agent 顺序: attacker_1, attacker_2, defender_1, defender_2
n_roles: 3                  # A1 / A2 / 防守者（D1=D2 共用角色）
role_embedding_dim: 32
# [投篮按键] per-role 输出宽度：A1 = 4 连续 loc/scale + 2 离散 logits；
# A2/D = 只输出 4 个连续参数（补 0 到 6，离散位由 mask 恒为"不按"）
role_out_dims: [6, 4, 4]
