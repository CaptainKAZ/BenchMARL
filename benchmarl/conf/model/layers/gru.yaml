
name: gru

hidden_size: 256
n_layers: 1
bias: True
dropout: 0
compile: False   # 实测 torch.compile(mode="reduce-overhead") 反而更慢（actor fwd+bwd 186.5ms → 104.7ms，见 /tmp/opencode/bench3_opt.py）
use_input_passthrough: True
mlp_num_cells: [256,256]
mlp_layer_class: torch.nn.Linear
mlp_activation_class: torch.nn.GELU
mlp_activation_kwargs: null
mlp_norm_class: torch.nn.LayerNorm
mlp_norm_kwargs:
  normalized_shape: 256
